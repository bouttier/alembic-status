name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Pytest (Python ${{ matrix.python-version }}, Flask ${{ matrix.flask }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        flask: [true, false]
        exclude:
          # Without Flask, only the latest Python is tested.
          - python-version: "3.11"
            flask: false
          - python-version: "3.12"
            flask: false
          - python-version: "3.13"
            flask: false
          - python-version: "3.14"
            flask: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install with Flask
        if: matrix.flask
        run: uv sync --locked --group flask --python ${{ matrix.python-version }}
      - name: Install without Flask
        if: ${{ !matrix.flask }}
        run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest -rs
